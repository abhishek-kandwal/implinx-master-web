    <path d="M42 46 C50 46 54 40 54 32 C54 24 50 18 42 18 C36 18 32 23 29 27 L35 33 C37 30 39 28 42 28 C45 28 46 30 46 32 C46 34 45 36 42 36 C39 36 37 34 35 31 L29 37 C32 41 36 46 42 46 Z" fill="url(#implinx-grad-accent)" />
